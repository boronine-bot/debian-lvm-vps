name: Build ISO

# Manual only. The source is the 64 MB netboot installer, not the 700 MB
# netinst image: it contains no package pool. The job uses a disposable
# no-dind worker, and each run replaces the one release because this Gitea
# stores no Actions artifacts.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debian 13 LVM ISO
    runs-on: ephemeral-no-dind-${{ gitea.repository_id }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}-iso
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch a static xorriso
        # The runner has no sudo and no package installation. This is GNU
        # xorriso 1.5.6.pl02, built with its bundled libraries and with
        # readline, zlib, and libacl disabled, so it needs only libc.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o xorriso \
            https://github.com/boronine-bot/debian-lvm-vps/releases/download/xorriso-1.5.6.pl02/xorriso-static
          echo '08285690bf6260d34e89d84a27fe2455caf63f0c0cbe4aff1544ad17cccd40c6  xorriso' | sha256sum -c -
          chmod 755 xorriso

      - name: Download and verify the Debian netboot installer
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base=https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images
          curl -fL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          curl -fL --retry 3 -o mini.iso "$base/netboot/mini.iso"
          grep ' ./netboot/mini.iso$' SHA256SUMS | sed 's| ./netboot/mini.iso$|  mini.iso|' | sha256sum -c -

      - name: Remaster the ISO
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PUBLIC_KEY}" ]; then
            echo 'Set the SSH_PUBLIC_KEY repository secret to one OpenSSH public key.' >&2
            exit 1
          fi
          XORRISO="${RUNNER_TEMP}/xorriso" python3 scripts/build-iso.py \
            "${RUNNER_TEMP}/mini.iso" \
            "${RUNNER_TEMP}/debian-13-lvm.iso"

      - name: Remove the Debian download
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/mini.iso" "${RUNNER_TEMP}/SHA256SUMS"

      - name: Publish the ISO as a release
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          GITEA_SERVER: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          api="$GITEA_SERVER/api/v1/repos/$REPOSITORY"
          auth=(-H "Authorization: token $GITEA_TOKEN")
          tag=debian-13-lvm
          status="$(curl -sS -o release.json -w '%{http_code}' "${auth[@]}" "$api/releases/tags/$tag")"
          if [ "$status" = "404" ]; then
            curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              -d '{"tag_name":"debian-13-lvm","name":"Debian 13 LVM ISO","prerelease":true,"body":"Replaced by every manual build."}' \
              "$api/releases" -o release.json
          elif [ "$status" != "200" ]; then
            echo "Could not read the $tag release (HTTP $status)." >&2
            exit 1
          fi
          release_id="$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')"
          python3 - <<'PY'
          import json, os, urllib.request
          release = json.load(open("release.json"))
          base = (f'{os.environ["GITEA_SERVER"]}/api/v1/repos/'
                  f'{os.environ["REPOSITORY"]}/releases/{release["id"]}')
          headers = {"Authorization": f'token {os.environ["GITEA_TOKEN"]}'}
          for asset in json.load(urllib.request.urlopen(
                  urllib.request.Request(f"{base}/assets", headers=headers))):
              urllib.request.urlopen(urllib.request.Request(
                  f'{base}/assets/{asset["id"]}', headers=headers, method="DELETE"))
          PY
          cd "$RUNNER_TEMP"
          for file in debian-13-lvm.iso debian-13-lvm.iso.sha256; do
            curl -fS -X POST "${auth[@]}" -F "attachment=@$file" \
              "$api/releases/$release_id/assets" -o /dev/null
          done
          echo "Published $tag"
