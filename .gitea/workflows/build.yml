name: Build ISO

# Manual only. The Debian netinst download and the remastered image are about
# 1 GB each, and neither should accumulate on a runner. The job uses a
# disposable no-dind worker, and the image is kept only as a one-day artifact.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debian 13 LVM ISO
    runs-on: ephemeral-no-dind-${{ gitea.repository_id }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}-iso
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch a static xorriso
        # The runner has no sudo and no package installation. This is GNU
        # xorriso 1.5.6.pl02, built with its bundled libraries and with
        # readline, zlib, and libacl disabled, so it needs only libc.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o xorriso \
            https://github.com/boronine-bot/debian-lvm-vps/releases/download/xorriso-1.5.6.pl02/xorriso-static
          echo '08285690bf6260d34e89d84a27fe2455caf63f0c0cbe4aff1544ad17cccd40c6  xorriso' | sha256sum -c -
          chmod 755 xorriso

      - name: Download and verify the Debian netinst ISO
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o SHA256SUMS \
            https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/SHA256SUMS
          curl -fL --retry 3 -o debian-13.8.0-amd64-netinst.iso \
            https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-13.8.0-amd64-netinst.iso
          grep ' debian-13.8.0-amd64-netinst.iso$' SHA256SUMS | sha256sum -c -

      - name: Remaster the ISO
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PUBLIC_KEY}" ]; then
            echo 'Set the SSH_PUBLIC_KEY repository secret to one OpenSSH public key.' >&2
            exit 1
          fi
          XORRISO="${RUNNER_TEMP}/xorriso" python3 scripts/build-iso.py \
            "${RUNNER_TEMP}/debian-13.8.0-amd64-netinst.iso" \
            "${RUNNER_TEMP}/debian-13-lvm.iso"

      - name: Remove the Debian download
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/debian-13.8.0-amd64-netinst.iso" "${RUNNER_TEMP}/SHA256SUMS"

      - name: Upload the remastered ISO
        uses: actions/upload-artifact@v3
        with:
          name: debian-13-lvm
          path: |
            ${{ runner.temp }}/debian-13-lvm.iso
            ${{ runner.temp }}/debian-13-lvm.iso.sha256
          if-no-files-found: error
          retention-days: 1
