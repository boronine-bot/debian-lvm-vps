# Unattended Debian 13 (trixie) install for a single-disk KVM VPS.
#
# Layout: a small ESP and /boot, then LVM. The volume group is named vg0 and
# holds one ext4 logical volume, vg0/root. The tail of the disk is left
# unpartitioned by the installer; preseed/late_command turns that tail into a
# second physical volume and adds it to vg0 without growing root. That free
# space is the reserve for short-lived read-only LVM snapshots.
#
# priority=critical stops the install on any question this file does not
# answer, so a forgotten prompt fails the install instead of waiting forever.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string vps
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# No root password and no first user. SSH login is the key written below.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean false

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

d-i partman-auto/method string lvm
d-i partman-auto/disk string REPLACE_DISK
d-i partman-auto-lvm/new_vg_name string vg0
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# /boot stays outside LVM so GRUB can read it. The root logical volume stops
# at priority 5000, which is the whole disk minus the snapshot reserve; the
# trailing "free" entry must not be $lvmok or the installer folds it into the
# volume group.
d-i partman-auto/expert_recipe string \
    vps-lvm :: \
        512 512 1024 free \
            $iflabel{ gpt } \
            $reusemethod{ } \
            method{ efi } \
            format{ } \
        . \
        1024 1024 1024 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        8192 5000 -1 ext4 \
            $defaultignore{ } $lvmok{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
            lv_name{ root } \
        . \
        5120 5120 10240 free \
            method{ keep } \
        .

d-i partman-auto/choose_recipe select vps-lvm
d-i partman/early_command string \
    debconf-set partman-auto/disk "$(list-devices disk | head -n1)"

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/services-select multiselect security, updates

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lvm2 sudo curl ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

d-i preseed/late_command string /cdrom/preseed/late-command
